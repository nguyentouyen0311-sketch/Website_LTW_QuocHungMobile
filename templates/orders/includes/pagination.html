{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Phân trang">
    <span>
      Trang {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} ({{ page_obj.paginator.count }} đơn hàng)
    </span>
    <div>
      {% if page_obj.has_previous %}
        <a
          class="button small"
          href="?{{ query_string }}&page={{ page_obj.previous_page_number }}"
        >
          Trước
        </a>
      {% endif %}
      <span class="page-current">{{ page_obj.number }}</span>
      {% if page_obj.has_next %}
        <a
          class="button small"
          href="?{{ query_string }}&page={{ page_obj.next_page_number }}"
        >
          Sau
        </a>
      {% endif %}
    </div>
  </nav>
{% endif %}
