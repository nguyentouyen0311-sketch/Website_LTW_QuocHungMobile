{% load static %}<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>{{ title }}</title><link rel="stylesheet" href="{% static 'css/tokens.css' %}"><link rel="stylesheet" href="{% static 'css/admin_category.css' %}"></head><body><main class="product-editor"><a href="{% url 'catalog:attribute_list' %}">← Quay lại thuộc tính</a><header><h1>{{ title }}</h1></header><form method="post" class="editor-card">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<small>{{ error }}</small>{% endfor %}</label>{% endfor %}<div class="editor-actions"><a href="{% url 'catalog:attribute_list' %}">Hủy</a><button>Lưu thuộc tính</button></div></form></main></body></html>
