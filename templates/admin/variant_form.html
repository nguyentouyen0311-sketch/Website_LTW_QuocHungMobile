{% load static %}<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="{% static 'css/tokens.css' %}"><link rel="stylesheet" href="{% static 'css/admin_category.css' %}"></head><body><main class="product-editor"><a href="{% url 'catalog:product_list' %}?product={{ product.id }}#variants">← Quay lại biến thể</a><header><h1>{{ title }}</h1><p>Biến thể được tạo từ đúng các giá trị thuộc tính đã khai báo. Hệ thống tự kiểm tra tổ hợp trùng lặp.</p></header><form method="post" class="editor-card">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<small>{{ error }}</small>{% endfor %}</label>{% endfor %}<div class="editor-actions"><a href="{% url 'catalog:product_list' %}?product={{ product.id }}#variants">Hủy</a><button>{% if is_edit %}Cập nhật biến thể{% else %}Tạo biến thể{% endif %}</button></div></form></main></body></html>
